<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fondo circular oscuro corporativo -->
  <circle cx="50" cy="50" r="48" fill="#1a365d" stroke="#2b6cb0" stroke-width="3"/>
  
  <!-- Símbolo de brújula/norte y fuerza combinados -->
  <!-- Disco/Placa de peso izquierda -->
  <rect x="22" y="38" width="6" height="24" rx="2" fill="#e2e8f0"/>
  <rect x="28" y="42" width="4" height="16" rx="1" fill="#cbd5e0"/>
  
  <!-- Barra central -->
  <rect x="32" y="47" width="36" height="6" rx="2" fill="#ffffff"/>
  
  <!-- Disco/Placa de peso derecha -->
  <rect x="68" y="42" width="4" height="16" rx="1" fill="#cbd5e0"/>
  <rect x="72" y="38" width="6" height="24" rx="2" fill="#e2e8f0"/>
  
  <!-- Flecha indicando el Norte -->
  <polygon points="50,18 42,36 50,32 58,36" fill="#e53e3e"/>
  
  <!-- Letra 'N' de Norte grabada en el centro -->
  <text x="50" y="78" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">NORTE</text>
</svg>
